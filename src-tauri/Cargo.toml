[package]
name = "taskmate"
version = "0.6.0"
description = "A local-first Markdown task manager for the desktop."
authors = ["Taskmate contributors"]
license = "MIT"
repository = "https://github.com/itvincent-git/taskmate"
edition = "2021"

[lib]
name = "taskmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
log = "0.4"
notify = "8.2.0"
reqwest = { version = "0.12", features = ["blocking", "json", "socks"] }
# Tauri Updater uses reqwest 0.13 with default features disabled. Enable its
# native system-proxy discovery so update artifacts follow macOS/Windows proxy settings too.
reqwest-system-proxy = { package = "reqwest", version = "0.13", default-features = false, features = ["system-proxy"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tempfile = "3.27.0"
uuid = { version = "1.24.0", features = ["v4"] }

[profile.dev]
debug = 1
