<div id="tm-filter-demo">
  <style>
    #tm-filter-demo{--tm-bg:light-dark(#f7f7f5,#20211f);--tm-panel:light-dark(#ffffff,#272825);--tm-soft:light-dark(#f0f1ed,#30312e);--tm-ink:light-dark(#30352f,#e5e8df);--tm-sub:light-dark(#73796e,#acb2a5);--tm-line:light-dark(#e2e5dd,#41443c);--tm-active:light-dark(#e7eee0,#3b4832);--tm-accent:light-dark(#4e6840,#bfd0ab);color:var(--tm-ink);font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}

ar(--tm-line);padding:12px;background:var(--tm-bg);min-width:0}#tm-filter-demo .tm-view{border:0;background:transparent;padding-left:0;font-weight:500;max-width:225px}#tm-filter-demo .tm-tools{margin:12px 0 10px;gap:8px}#tm-filter-demo .tm-tools button{display:flex;align-items:center;gap:6px}#tm-filter-demo .tm-tools button[aria-expanded=true]{background:var(--tm-active);border-color:var(--tm-accent);color:var(--tm-accent)}#tm-filter-demo .tm-count{border-radius:4px;background:var(--tm-soft);padding:0 5px;font-size:12px}#tm-filter-demo .tm-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}#tm-filter-demo .tm-chip{display:flex;align-items:center;border:1px solid var(--tm-line);background:var(--tm-panel);border-radius:6px;overflow:hidden;font-size:12px}#tm-filter-demo .tm-chip button{border:0;border-radius:0;padding:3px 5px;background:transparent;font-size:12px}#tm-filter-demo .tm-chip .tm-chip-label{padding-left:8px}#tm-filter-demo .tm-folder{display:flex;align-items:center;gap:6px;padding:7px 2px;color:var(--tm-sub);font-size:12px;border-top:1px solid var(--tm-line)}#tm-filter-demo .tm-card{display:block;text-align:left;width:100%;margin:7px 0;padding:12px;border-radius:9px;background:var(--tm-panel)}#tm-filter-demo .tm-card.selected{border-color:var(--tm-accent);background:var(--tm-active)}#tm-filter-demo .tm-card-title{font-weight:500;display:block;margin-bottom:8px}#tm-filter-demo .tm-card-meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tm-sub);flex-wrap:wrap}#tm-filter-demo .tm-badge{padding:1px 6px;background:var(--tm-soft);border-radius:4px;color:var(--tm-ink)}#tm-filter-demo .tm-time{margin-left:auto}#tm-filter-demo .tm-list-foot{display:flex;align-items:center;gap:5px;color:var(--tm-sub);font-size:12px;margin-top:16px}#tm-filter-demo .tm-editor{background:var(--tm-panel);min-width:0}#tm-filter-demo .tm-editor-bar{border-bottom:1px solid var(--tm-line);padding:12px 20px;display:flex;justify-content:space-between;gap:10px;color:var(--tm-sub);font-size:12px}#tm-filter-demo .tm-document{padding:30px clamp(20px,4vw,46px)}#tm-filter-demo h1{font-size:25px;line-height:1.4;font-weight:500;margin:0 0 22px}#tm-filter-demo h2{font-size:16px;line-height:1.5;font-weight:500;margin:26px 0 12px}#tm-filter-demo p{margin:12px 0}#tm-filter-demo .tm-props{display:grid;grid-template-columns:70px 1fr;gap:10px;font-size:12px;margin-bottom:28px}#tm-filter-demo .tm-check{display:flex;align-items:flex-start;gap:8px;margin:10px 0}#tm-filter-demo .tm-check input{accent-color:var(--tm-accent);margin-top:5px}#tm-filter-demo .tm-menu{position:absolute;z-index:5;left:60px;top:108px;width:min(462px,calc(100% - 76px));border:1px solid var(--tm-line);border-radius:12px;background:var(--tm-panel);box-shadow:0 14px 45px light-dark(#24321e26,#00000055);padding:16px}#tm-filter-demo .tm-menu[hidden]{display:none}#tm-filter-demo .tm-menu-title{font-weight:500;font-size:14px}#tm-filter-demo .tm-link{border:0;background:transparent;padding:4px;color:var(--tm-accent)}#tm-filter-demo .tm-condition{display:grid;grid-template-columns:86px 54px minmax(0,1fr) 28px;gap:6px;align-items:center;margin:12px 0}#tm-filter-demo .tm-condition select{min-width:0;width:100%;padding:6px}#tm-filter-demo .tm-values{display:flex;gap:5px;flex-wrap:wrap}#tm-filter-demo .tm-values label{border:1px solid var(--tm-line);padding:3px 6px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:4px}#tm-filter-demo input[type=checkbox]{accent-color:var(--tm-accent)}#tm-filter-demo .tm-menu-foot{border-top:1px solid var(--tm-line);padding-top:12px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}#tm-filter-demo .tm-menu-foot .tm-done{background:var(--tm-accent);border-color:var(--tm-accent);color:var(--tm-panel)}#tm-filter-demo .tm-quick{display:grid;gap:4px;margin:12px 0}#tm-filter-demo .tm-quick button{border:0;text-align:left;padding:8px;display:flex;align-items:center;justify-content:space-between}#tm-filter-demo .tm-quick button.active{background:var(--tm-active);color:var(--tm-accent)}#tm-filter-demo .tm-sort-row{display:grid;grid-template-columns:18px minmax(0,1fr) 106px 28px 28px;gap:5px;align-items:center;margin:10px 0}#tm-filter-demo .tm-sort-row select{width:100%;min-width:0}#tm-filter-demo .tm-divider{border-top:1px solid var(--tm-line);padding-top:12px;margin-top:12px}#tm-filter-demo .tm-empty{text-align:center;padding:40px 10px;color:var(--tm-sub)}#tm-filter-demo .tm-chip button:hover,#tm-filter-demo .tm-link:hover{background:var(--tm-soft)}
    @media(max-width:760px){#tm-filter-demo .tm-body{grid-template-columns:42px 300px minmax(0,1fr)}#tm-filter-demo .tm-document{padding:25px 20px}#tm-filter-demo .tm-editor-bar{padding:12px}#tm-filter-demo .tm-menu{left:54px;width:min(450px,calc(100% - 66px))}}@media(max-width:620px){#tm-filter-demo .tm-body{grid-template-columns:1fr;min-height:570px}#tm-filter-demo .tm-rail,#tm-filter-demo .tm-editor{display:none}#tm-filter-demo .tm-list{border:0}#tm-filter-demo .tm-menu{left:10px;top:108px;width:calc(100% - 20px);padding:12px}#tm-filter-demo .tm-condition{grid-template-columns:72px 38px minmax(0,1fr) 24px;gap:4px}#tm-filter-demo .tm-values{gap:4px}#tm-filter-demo .tm-values label{padding:3px}#tm-filter-demo .tm-sort-row{grid-template-columns:14px minmax(0,1fr) 90px 24px 24px;gap:3px}#tm-filter-demo .tm-tab{max-width:210px;overflow:hidden;white-space:nowrap}#tm-filter-demo .tm-window{border-radius:8px}}@media(pointer:coarse){#tm-filter-demo button,#tm-filter-demo select{min-height:40px}#tm-filter-demo .tm-chip button{min-height:36px}}
  </style>
  <div class="tm-window" aria-label="Taskmate 筛选与排序方案 B">
    <div class="tm-top"><div class="tm-dots" aria-hidden="true"><span></span><span></span><span></span></div><span class="tm-sub">Taskmate</span><div class="tm-tab"><i data-lucide="file-text" aria-hidden="true"></i><span>优化筛选与排序</span></div></div>
    <div class="tm-body">
      <nav class="tm-rail" aria-label="应用导航"><div class="tm-logo"><i data-lucide="check" aria-hidden="true"></i></div><button class="tm-icon cursor-interaction" aria-label="任务" aria-current="page"><i data-lucide="files" aria-hidden="true"></i></button><span class="tm-sub"><i data-lucide="search" aria-hidden="true"></i></span><span class="tm-sub"><i data-lucide="history" aria-hidden="true"></i></span></nav>
      <section class="tm-list" aria-label="任务列表">
        <div class="tm-flex tm-space"><div class="tm-flex"><select id="tm-view" class="tm-view cursor-interaction" aria-label="保存的视图"><option value="all">全部任务</option><option value="focus">高优先级进行中</option></select><span id="tm-total" class="tm-sub" aria-live="polite">3</span></div><span class="tm-sub"><i data-lucide="folder-open" aria-hidden="true"></i></span></div>
        <div class="tm-flex tm-tools"><button id="tm-open-filter" class="cursor-interaction" aria-expanded="false" aria-controls="tm-filter-panel"><i data-lucide="list-filter" aria-hidden="true"></i>筛选 <span id="tm-filter-count" class="tm-count">2</span></button><button id="tm-open-sort" class="cursor-interaction" aria-expanded="false" aria-controls="tm-sort-panel"><i data-lucide="arrow-down-up" aria-hidden="true"></i>排序 <span id="tm-sort-count" class="tm-count">1</span></button></div>
        <div id="tm-chips" class="tm-chips" aria-label="已生效的筛选条件"></div>
        <div class="tm-folder"><i data-lucide="chevron-down" aria-hidden="true"></i><i data-lucide="folder" aria-hidden="true"></i>产品研发</div>
        <div id="tm-tasks"></div>
        <div class="tm-list-foot"><i data-lucide="arrow-down-wide-narrow" aria-hidden="true"></i><span id="tm-sort-summary">更新时间 · 最新优先</span></div>
      </section>
      <section class="tm-editor" aria-label="任务内容预览"><div class="tm-editor-bar"><span id="tm-editor-path">产品研发 / 优化筛选与排序.md</span><span>已保存</span></div><div class="tm-document"><h1 id="tm-editor-title">优化筛选与排序</h1><div class="tm-props"><span class="tm-sub">状态</span><span id="tm-editor-status">进行中</span><span class="tm-sub">优先级</span><span id="tm-editor-priority">高</span><span class="tm-sub">标签</span><span>体验优化 · 桌面端</span></div><p>让常用筛选更快完成，也能随时看清当前规则。</p><h2>交互设计</h2><label class="tm-check"><input type="checkbox" checked disabled>拆分筛选与排序入口</label><label class="tm-check"><input type="checkbox" checked disabled>展示可移除的条件标签</label><label class="tm-check"><input type="checkbox" disabled>按需添加字段条件</label><label class="tm-check"><input type="checkbox" disabled>验证多字段排序体验</label></div></section>
      <section id="tm-filter-panel" class="tm-menu" aria-label="筛选条件" hidden>
        <div class="tm-flex tm-space"><span class="tm-menu-title">筛选条件</span><button id="tm-clear" class="tm-link cursor-interaction">清除筛选</button></div>
        <div class="tm-sub" style="margin:6px 0 14px">同时满足以下条件</div>
        <div id="tm-filter-rows"></div>
        <select id="tm-add-filter" class="cursor-interaction" aria-label="添加筛选条件"><option value="">＋ 添加条件</option></select>
        <div class="tm-menu-foot"><span id="tm-matches" class="tm-sub" aria-live="polite">匹配 3 项任务</span><button id="tm-filter-done" class="tm-done cursor-interaction">完成</button></div>
      </section>
      <section id="tm-sort-panel" class="tm-menu" aria-label="排序设置" hidden>
        <div class="tm-flex tm-space"><span class="tm-menu-title">排序</span><button id="tm-reset-sort" class="tm-link cursor-interaction">恢复默认</button></div>
        <div class="tm-quick"><button data-quick="recent" class="cursor-interaction">最近更新<span></span></button><button data-quick="az" class="cursor-interaction">标题 A–Z<span></span></button><button data-quick="za" class="cursor-interaction">标题 Z–A<span></span></button></div>
        <button id="tm-advanced-toggle" class="tm-link cursor-interaction" aria-expanded="false">多字段排序 ›</button>
        <div id="tm-advanced" class="tm-divider" hidden><div class="tm-sub">依次比较以下字段，空值放最后</div><div id="tm-sort-rows"></div><button id="tm-add-sort" class="tm-link cursor-interaction">＋ 添加排序字段</button></div>
        <div class="tm-menu-foot"><span class="tm-sub">即时更新任务顺序</span><button id="tm-sort-done" class="tm-done cursor-interaction">完成</button></div>
      </section>
    </div>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('tm-filter-demo');
    const el=id=>root.querySelector('#'+id);
    const tasks=[{id:1,title:'优化筛选与排序',status:'进行中',priority:'高',days:0},{id:2,title:'完善任务快捷操作',status:'进行中',priority:'高',days:1},{id:3,title:'修复归档后的列表刷新',status:'进行中',priority:'高',days:3},{id:4,title:'整理发布检查清单',status:'待办',priority:'高',days:2},{id:5,title:'调整编辑器留白',status:'进行中',priority:'中',days:5},{id:6,title:'补充快捷键文档',status:'待办',priority:'中',days:12},{id:7,title:'验证工作区恢复',status:'已完成',priority:'高',days:8},{id:8,title:'统一属性字段名称',status:'已完成',priority:'低',days:16}];
    const defaults={status:['进行中'],priority:'高',recent:false,sorts:[{key:'updated',direction:'desc'}],selected:1};
    const saved=window.openai?.widgetState;
    const incoming=saved?.modelContent?.demo==='taskmate-filter-sort-b'?saved.privateContent:null;
    let s=structuredClone(defaults),panel='',advanced=false;
    if(incoming&&Array.isArray(incoming.status)&&incoming.status.every(x=>['进行中','待办','已完成'].includes(x))&&['','高','中','低'].includes(incoming.priority)&&Array.isArray(incoming.sorts)&&incoming.sorts.every(x=>['updated','title','priority'].includes(x.key)&&['asc','desc'].includes(x.direction)))s={...defaults,...incoming};
    const fields={status:'状态',priority:'优先级',recent:'更新时间'};
    const names={updated:'更新时间',title:'标题',priority:'优先级'};
    const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function persist(){window.openai?.setWidgetState?.({modelContent:{demo:'taskmate-filter-sort-b',filters:{status:s.status,priority:s.priority,recent:s.recent},sorts:s.sorts},privateContent:s})?.catch(()=>{});}
    function filtered(){return tasks.filter(t=>(!s.status.length||s.status.includes(t.status))&&(!s.priority||t.priority===s.priority)&&(!s.recent||t.days<=7)).sort((a,b)=>{for(const sort of s.sorts){let d=sort.key==='updated'?b.days-a.days:sort.key==='priority'?['低','中','高'].indexOf(a.priority)-['低','中','高'].indexOf(b.priority):a.title.localeCompare(b.title,'zh-CN');if(d)return sort.direction==='asc'?d:-d;}return a.days-b.days;});}
    function directionLabel(sort){return sort.key==='updated'?(sort.direction==='desc'?'最新优先':'最早优先'):sort.key==='priority'?(sort.direction==='desc'?'高到低':'低到高'):(sort.direction==='asc'?'A–Z':'Z–A');}
    function render(){
      const list=filtered(),active=Object.keys(fields).filter(k=>k==='status'?s.status.length:!!s[k]);
      el('tm-total').textContent=list.length;
      el('tm-filter-count').textContent=active.length;el('tm-filter-count').hidden=!active.length;
      el('tm-sort-count').textContent=s.sorts.length;
      el('tm-chips').innerHTML=active.map(k=>`<div class="tm-chip"><button class="tm-chip-label cursor-interaction" data-edit="${k}" aria-label="编辑${fields[k]}条件">${fields[k]}：${escape(k==='status'?s.status.join(' / '):k==='recent'?'近 7 天':s[k])}</button><button class="cursor-interaction" data-remove="${k}" aria-label="移除${fields[k]}筛选">×</button></div>`).join('');
      el('tm-tasks').innerHTML=list.length?list.map(t=>`<button class="tm-card cursor-interaction ${t.id===s.selected?'selected':''}" data-task="${t.id}" aria-pressed="${t.id===s.selected}"><span class="tm-card-title">${t.title}</span><span class="tm-card-meta"><span class="tm-badge">${t.status}</span><span>优先级 ${t.priority}</span><span class="tm-time">${t.days===0?'刚刚':t.days+' 天前'}</span></span></button>`).join(''):'<div class="tm-empty">没有符合条件的任务<br><button class="tm-link cursor-interaction" data-empty-clear>清除筛选</button></div>';
      el('tm-sort-summary').textContent=s.sorts.map(x=>names[x.key]+' · '+directionLabel(x)).join(' → ');
      el('tm-matches').textContent=`匹配 ${list.length} 项任务`;
      el('tm-filter-rows').innerHTML=active.map(k=>`<div class="tm-condition"><span>${fields[k]}</span><span class="tm-sub">${k==='status'?'属于':k==='priority'?'等于':'范围'}</span>${k==='status'?'<div class="tm-values">'+['待办','进行中','已完成'].map(v=>`<label><input type="checkbox" data-status="${v}" ${s.status.includes(v)?'checked':''}>${v}</label>`).join('')+'</div>':k==='priority'?`<select class="cursor-interaction" data-priority aria-label="优先级条件">${['高','中','低'].map(v=>`<option ${s.priority===v?'selected':''}>${v}</option>`).join('')}</select>`:'<span>最近 7 天</span>'}<button class="tm-icon cursor-interaction" data-remove="${k}" aria-label="移除${fields[k]}条件">×</button></div>`).join('');
      el('tm-add-filter').innerHTML='<option value="">＋ 添加条件</option>'+Object.keys(fields).filter(k=>!active.includes(k)).map(k=>`<option value="${k}">${fields[k]}</option>`).join('');el('tm-add-filter').disabled=active.length===3;
      root.querySelectorAll('[data-quick]').forEach(b=>{const q=b.dataset.quick;const match=s.sorts.length===1&&(q==='recent'?s.sorts[0].key==='updated'&&s.sorts[0].direction==='desc':s.sorts[0].key==='title'&&s.sorts[0].direction===(q==='az'?'asc':'desc'));b.classList.toggle('active',match);b.lastElementChild.textContent=match?'✓':'';});
      el('tm-sort-rows').innerHTML=s.sorts.map((x,i)=>`<div class="tm-sort-row"><span class="tm-sub">${i+1}</span><select class="cursor-interaction" data-sort-field="${i}" aria-label="排序字段 ${i+1}">${Object.keys(names).filter(k=>k===x.key||!s.sorts.some(y=>y.key===k)).map(k=>`<option value="${k}" ${k===x.key?'selected':''}>${names[k]}</option>`).join('')}</select><select class="cursor-interaction" data-sort-dir="${i}" aria-label="排序方向 ${i+1}"><option value="desc" ${x.direction==='desc'?'selected':''}>${directionLabel({...x,direction:'desc'})}</option><option value="asc" ${x.direction==='asc'?'selected':''}>${directionLabel({...x,direction:'asc'})}</option></select><button class="tm-icon cursor-interaction" data-up="${i}" aria-label="提高排序优先级 ${i+1}" ${i===0?'disabled':''}>↑</button><button class="tm-icon cursor-interaction" data-sort-remove="${i}" aria-label="移除排序 ${i+1}" ${s.sorts.length===1?'disabled':''}>×</button></div>`).join('');el('tm-add-sort').disabled=s.sorts.length===3;
      const selected=tasks.find(t=>t.id===s.selected)||tasks[0];el('tm-editor-title').textContent=selected.title;el('tm-editor-status').textContent=selected.status;el('tm-editor-priority').textContent=selected.priority;el('tm-editor-path').textContent='产品研发 / '+selected.title+'.md';
    }
    function show(next){panel=panel===next?'':next;el('tm-filter-panel').hidden=panel!=='filter';el('tm-sort-panel').hidden=panel!=='sort';el('tm-open-filter').setAttribute('aria-expanded',String(panel==='filter'));el('tm-open-sort').setAttribute('aria-expanded',String(panel==='sort'));}
    function clear(){s.status=[];s.priority='';s.recent=false;render();persist();}
    el('tm-open-filter').onclick=()=>show('filter');el('tm-open-sort').onclick=()=>show('sort');el('tm-filter-done').onclick=()=>show('filter');el('tm-sort-done').onclick=()=>show('sort');el('tm-clear').onclick=clear;
    el('tm-reset-sort').onclick=()=>{s.sorts=structuredClone(defaults.sorts);render();persist();};
    el('tm-advanced-toggle').onclick=()=>{advanced=!advanced;el('tm-advanced').hidden=!advanced;el('tm-advanced-toggle').setAttribute('aria-expanded',String(advanced));el('tm-advanced-toggle').textContent='多字段排序 '+(advanced?'⌄':'›');};
    el('tm-add-sort').onclick=()=>{const key=Object.keys(names).find(k=>!s.sorts.some(x=>x.key===k));if(key){s.sorts.push({key,direction:key==='title'?'asc':'desc'});render();persist();}};
    el('tm-add-filter').onchange=e=>{const k=e.target.value;if(!k)return;s[k]=k==='status'?['进行中']:k==='priority'?'高':true;render();persist();};
    el('tm-view').onchange=e=>{if(e.target.value==='focus'){s.status=['进行中'];s.priority='高';s.recent=false;}else{s.status=[];s.priority='';s.recent=false;}render();persist();};
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.remove){s[b.dataset.remove]=b.dataset.remove==='status'?[]:b.dataset.remove==='priority'?'':false;render();persist();}else if(b.dataset.edit){if(panel!=='filter')show('filter');}else if(b.dataset.task){s.selected=Number(b.dataset.task);render();persist();}else if(b.hasAttribute('data-empty-clear'))clear();else if(b.dataset.quick){s.sorts=[b.dataset.quick==='recent'?{key:'updated',direction:'desc'}:{key:'title',direction:b.dataset.quick==='az'?'asc':'desc'}];render();persist();}else if(b.dataset.up!==undefined){const i=Number(b.dataset.up);if(i>0){[s.sorts[i-1],s.sorts[i]]=[s.sorts[i],s.sorts[i-1]];render();persist();}}else if(b.dataset.sortRemove!==undefined&&s.sorts.length>1){s.sorts.splice(Number(b.dataset.sortRemove),1);render();persist();}});
    root.addEventListener('change',e=>{const t=e.target;if(t.dataset.status){s.status=t.checked?[...s.status,t.dataset.status]:s.status.filter(v=>v!==t.dataset.status);render();persist();}else if(t.hasAttribute('data-priority')){s.priority=t.value;render();persist();}else if(t.dataset.sortField!==undefined){const i=Number(t.dataset.sortField);s.sorts[i].key=t.value;s.sorts[i].direction=t.value==='title'?'asc':'desc';render();persist();}else if(t.dataset.sortDir!==undefined){s.sorts[Number(t.dataset.sortDir)].direction=t.value;render();persist();}});
    root.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel){const old=panel;show(panel);el(old==='filter'?'tm-open-filter':'tm-open-sort').focus();}});
    window.addEventListener('openai:set_globals',e=>{const next=e.detail?.globals?.widgetState;if(next?.modelContent?.demo==='taskmate-filter-sort-b'&&next.privateContent){const n=next.privateContent;if(Array.isArray(n.status)&&Array.isArray(n.sorts)){s={...defaults,...n};render();}}});
    render();
    if(globalThis.Tweak){const design={density:'标准'};const tweak=new Tweak({container:root,onChange:()=>{root.querySelectorAll('.tm-card').forEach(card=>card.style.padding=design.density==='紧凑'?'8px 10px':'12px');}});tweak.addSelect(design,'density',{label:'任务卡片密度',options:['标准','紧凑']});}
  })();
  </script>
</div>
