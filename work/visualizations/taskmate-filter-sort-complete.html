<script>
(()=>{
const root=document.getElementById('tm-complete'), el=id=>root.querySelector('#'+id);
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const options=(pairs,value)=>pairs.map(([id,label])=>`<option value="${esc(id)}" ${id===String(value)?'selected':''}>${esc(label)}</option>`).join('');
const states=[['todo','待办'],['doing','进行中'],['done','已完成'],['cancelled','已取消']];
const priorities=[['low','低'],['medium','中'],['high','高'],['urgent','紧急']];
const tagOptions=[['ux','体验'],['bug','修复'],['docs','文档'],['release','发布']];
const fields={title:{name:'标题',type:'text',built:true,required:true},status:{name:'状态',type:'select',opts:states},priority:{name:'优先级',type:'ordered',opts:priorities},tags:{name:'标签',type:'multi',opts:tagOptions},due:{name:'截止日期',type:'date'},estimate:{name:'预计工时',type:'number'},flag:{name:'重点任务',type:'boolean'},note:{name:'备注',type:'textarea'},url:{name:'链接',type:'url'},reminder:{name:'提醒时间',type:'datetime'},created:{name:'创建时间',type:'datetime',built:true,required:true},updated:{name:'更新时间',type:'datetime',built:true,required:true},filename:{name:'文件名',type:'text',built:true,required:true}};
const opNames={in:'属于',notIn:'不属于',eq:'等于',ne:'不等于',gt:'高于',gte:'不低于',lt:'低于',lte:'不高于',any:'包含任意',all:'包含全部',none:'不包含任意',notAll:'不包含全部',exact:'完全一致',contains:'包含',notContains:'不包含',starts:'开头是',ends:'结尾是',between:'介于',outside:'不介于',on:'是',notOn:'不是',before:'早于',after:'晚于',onBefore:'不晚于',onAfter:'不早于',relative:'相对时间',yes:'是',no:'否',empty:'未设置',set:'已设置'};
const dateOps=['on','notOn','before','after','onBefore','onAfter','between','outside','relative'];
const relativeOptions=[['today','今天'],['yesterday','昨天'],['week','本周'],['month','本月'],['last','过去 N 天'],['next','未来 N 天'],['older','早于 N 天前']];
function ops(f){const type=f.type;let list=type==='select'?['in','notIn']:type==='ordered'?['eq','ne','in','notIn','gt','gte','lt','lte']:type==='multi'?['any','all','none','notAll','exact']:type==='number'?['eq','ne','gt','gte','lt','lte','between','outside']:['date','datetime'].includes(type)?dateOps:type==='boolean'?['yes','no']:['contains','notContains','eq','ne','starts','ends'];return f.required?list:[...list,'empty','set'];}
function opLabel(f,op){if(f.type==='number')return {gt:'大于',gte:'大于等于',lt:'小于',lte:'小于等于'}[op]||opNames[op];return opNames[op];}
const localDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const start=new Date();start.setHours(0,0,0,0);
const day=offset=>{const d=new Date(start);d.setDate(d.getDate()+offset);return localDay(d);};
const time=offset=>day(offset)+'T10:30';
const tasks=[
{id:'a',title:'优化筛选与排序',status:'doing',priority:'high',tags:['ux'],due:day(2),estimate:6,flag:true,note:'完善字段判断与条件组合',url:'https://example.com/design',updated:time(0),created:time(-15),folder:'产品研发',archived:false},
{id:'b',title:'修复归档后的列表刷新',status:'doing',priority:'urgent',tags:['bug','release'],due:day(-1),estimate:3,flag:true,note:'阻塞发布',url:'',updated:time(-1),created:time(-7),folder:'产品研发',archived:false},
{id:'c',title:'补充快捷键文档',status:'todo',priority:'medium',tags:['docs'],due:null,estimate:2,flag:false,note:'',updated:time(-2),created:time(-20),folder:'产品研发/体验',archived:false},
{id:'d',title:'调整编辑器留白',status:'doing',priority:'low',tags:['ux'],due:day(8),estimate:1,flag:false,note:'改善长文阅读',updated:time(-5),created:time(-25),folder:'产品研发/体验',archived:false},
{id:'e',title:'整理发布检查清单',status:'todo',priority:'high',tags:['release','docs'],due:day(0),estimate:4,flag:true,note:'准备新版本',updated:time(-3),created:time(-6),folder:'产品研发',archived:false},
{id:'f',title:'任务 2：验证恢复流程',status:'done',priority:'medium',tags:['bug'],due:day(-2),estimate:0,flag:false,note:'验证通过',updated:time(-6),created:time(-30),folder:'产品研发',archived:false},
{id:'g',title:'任务 10：整理历史反馈',status:null,priority:null,tags:[],due:null,estimate:null,flag:null,note:'  ',updated:time(-9),created:time(-10),folder:'个人',archived:false},
{id:'h',title:'收集下个版本需求',status:'todo',priority:null,tags:['ux'],due:day(15),estimate:8,flag:false,note:'筛选需要的场景',updated:time(-4),created:time(-8),folder:'个人',archived:false},
{id:'i',title:'旧版菜单优化',status:'done',priority:'high',tags:['ux'],due:day(-10),estimate:5,flag:false,note:'已发布',updated:time(-20),created:time(-60),folder:'产品研发',archived:true},
{id:'j',title:'取消的发布计划',status:'cancelled',priority:'low',tags:['release'],due:null,estimate:0,flag:false,note:'取消',updated:time(-11),created:time(-40),folder:'个人',archived:true}
].map(t=>({...t,filename:t.title+'.md',reminder:t.due?t.due+'T09:00':null}));
let nextId=30;const uid=()=>`n${Date.now().toString(36)}-${nextId++}`;
function leaf(key='status'){const f=fields[key],op=ops(f)[0];return {id:uid(),enabled:true,key,op,value:['in','notIn','any','all','none','notAll','exact'].includes(op)?[]:'',upper:'',relative:'last',days:7};}
const defaultSort=[{key:'updated',direction:'desc',nulls:'last'}];
const allConfig={archive:'active',folder:'',subfolders:true,root:{id:'root',match:'all',children:[]},sorts:clone(defaultSort)};
const initial=clone(allConfig);initial.root.children=[{...leaf('status'),value:['todo','doing']},{...leaf('priority'),op:'gte',value:'medium'}];initial.sorts=[{key:'priority',direction:'desc',nulls:'last'},{key:'due',direction:'asc',nulls:'last'}];
let applied=clone(initial),draft=clone(initial),tab='filter',open=true,views=[],activeId='',saveOpen=false,fieldSearch='';
const remembered=window.openai?.widgetState;
function safeConfig(c){if(!c||!c.root||!Array.isArray(c.root.children)||!['active','archived','all'].includes(c.archive)||!Array.isArray(c.sorts)||!c.sorts.length)return false;const ids=new Set();function valid(n,depth=0){if(depth>10||!n||typeof n.id!=='string'||ids.has(n.id))return false;ids.add(n.id);if(Array.isArray(n.children))return ['all','any'].includes(n.match)&&n.children.every(v=>valid(v,depth+1));return !!fields[n.key]&&ops(fields[n.key]).includes(n.op);}return valid(c.root)&&c.sorts.every(s=>fields[s.key]&&['asc','desc'].includes(s.direction)&&['first','last'].includes(s.nulls));}
if(remembered?.modelContent?.demo==='taskmate-complete'&&safeConfig(remembered.privateContent?.applied)){const p=remembered.privateContent;applied=clone(p.applied);draft=safeConfig(p.draft)?clone(p.draft):clone(applied);views=Array.isArray(p.views)?p.views.filter(v=>v&&typeof v.name==='string'&&safeConfig(v.config)):[];activeId=typeof p.activeId==='string'?p.activeId:'';tab=p.tab==='sort'?'sort':'filter';}
function persist(){const privateContent={applied,draft,views,activeId,tab};const payload={modelContent:{demo:'taskmate-complete',filters:draft.root,sorts:draft.sorts,scope:{archive:draft.archive,folder:draft.folder}},privateContent};if(JSON.stringify(payload).length<15000)window.openai?.setWidgetState?.(payload)?.catch(()=>{});}
function walk(n,fn){fn(n);if(n.children)n.children.forEach(v=>walk(v,fn));}
walk(draft.root,n=>{const num=Number(String(n.id).slice(1));if(Number.isFinite(num))nextId=Math.max(nextId,num+1);});
function find(id,n=draft.root){if(n.id===id)return n;for(const child of n.children||[]){const found=find(id,child);if(found)return found;}return null;}
function remove(id,n=draft.root){if(!n.children)return;n.children=n.children.filter(v=>v.id!==id);n.children.forEach(v=>remove(id,v));}
const empty=v=>v==null||(typeof v==='string'&&!v.trim())||(Array.isArray(v)&&!v.length);
const collection=op=>['in','notIn','any','all','none','notAll','exact'].includes(op);
const noValue=op=>['empty','set','yes','no'].includes(op);
function ruleError(n){if(!n.enabled)return '';const f=fields[n.key];if(noValue(n.op))return '';if(collection(n.op))return !Array.isArray(n.value)||!n.value.length?'至少选择一个选项。':n.value.some(v=>!f.opts.some(o=>o[0]===v))?'选项已失效，请重新选择。':'';if(f.opts&&!empty(n.value)&&!f.opts.some(o=>o[0]===n.value))return '选项已失效，请重新选择。';if(n.op==='relative'){if(!relativeOptions.some(v=>v[0]===n.relative))return '请选择有效的相对时间。';if(['last','next','older'].includes(n.relative)){if(!Number.isSafeInteger(Number(n.days))||Number(n.days)<1)return '天数必须为正整数。';const check=new Date(start);check.setDate(check.getDate()+Number(n.days));if(!Number.isFinite(check.getTime()))return '天数超出可计算范围。';}return '';}if(empty(n.value))return '请填写判断值。';if(f.type==='number'&&!Number.isFinite(Number(n.value)))return '请输入有效数字。';if(['date','datetime'].includes(f.type)&&!Number.isFinite(new Date(n.value).getTime()))return '请输入有效日期。';if(['between','outside'].includes(n.op)){if(empty(n.upper))return '请填写范围上界。';if(f.type==='number'){if(!Number.isFinite(Number(n.upper)))return '请输入有效数字。';if(Number(n.value)>Number(n.upper))return '下界不能大于上界。';}else if(!Number.isFinite(new Date(n.upper).getTime()))return '请输入有效日期。';else if(n.value>n.upper)return '开始时间不能晚于结束时间。';}return '';}
function errors(){const list=[];walk(draft.root,n=>{if(!n.children){const error=ruleError(n);if(error)list.push([n.id,error]);}});return list;}
function enabledCount(n){return n.children?n.children.reduce((a,v)=>a+enabledCount(v),0):n.enabled?1:0;}
function compare(f,a,b){if(f.type==='ordered'||f.type==='select')return f.opts.findIndex(v=>v[0]===a)-f.opts.findIndex(v=>v[0]===b);if(f.type==='number')return Number(a)-Number(b);if(f.type==='boolean')return Number(a)-Number(b);if(f.type==='date')return String(a).localeCompare(String(b));if(f.type==='datetime')return new Date(a).getTime()-new Date(b).getTime();return String(a).toLocaleLowerCase().localeCompare(String(b).toLocaleLowerCase(),'zh-CN',{numeric:true,sensitivity:'base'});}
function nextDayString(value){const d=new Date(value+'T00:00');d.setDate(d.getDate()+1);return localDay(d);}
function relativeBounds(n){const today=day(0);if(n.relative==='today')return [today,today];if(n.relative==='yesterday')return [day(-1),day(-1)];if(n.relative==='last')return [day(1-Number(n.days)),today];if(n.relative==='next')return [today,day(Number(n.days)-1)];if(n.relative==='older')return ['',day(-Number(n.days))];const from=new Date(start),to=new Date(start);if(n.relative==='week'){const delta=(from.getDay()+6)%7;from.setDate(from.getDate()-delta);to.setTime(from.getTime());to.setDate(to.getDate()+6);}else{from.setDate(1);to.setMonth(to.getMonth()+1,0);}return [localDay(from),localDay(to)];}
function matchesRule(t,n){if(!n.enabled)return true;const f=fields[n.key],a=t[n.key],b=n.value;if(n.op==='empty')return empty(a);if(n.op==='set')return !empty(a);if(empty(a))return false;if(n.op==='yes')return a===true;if(n.op==='no')return a===false;if(n.op==='in')return b.includes(a);if(n.op==='notIn')return !b.includes(a);if(['any','all','none','notAll','exact'].includes(n.op)){const arr=Array.isArray(a)?a:[];if(n.op==='any')return b.some(v=>arr.includes(v));if(n.op==='all')return b.every(v=>arr.includes(v));if(n.op==='none')return b.every(v=>!arr.includes(v));if(n.op==='notAll')return !b.every(v=>arr.includes(v));return arr.length===b.length&&b.every(v=>arr.includes(v));}
if(n.op==='relative'){const [lo,hi]=relativeBounds(n),actual=String(a).slice(0,10);return n.relative==='older'?actual<hi:actual>=lo&&actual<=hi;}
if(['date','datetime'].includes(f.type)){const isDay=String(b).length===10,isMinute=!isDay&&String(b).length===16;const actual=new Date(String(a).length===10?a+'T00:00':a).getTime(),low=new Date(isDay?b+'T00:00':b).getTime(),high=isDay?new Date(nextDayString(b)+'T00:00').getTime():low+(isMinute?60000:1);if(n.op==='on'||n.op==='notOn'){const within=actual>=low&&actual<high;return n.op==='on'?within:!within;}if(n.op==='before')return actual<low;if(n.op==='after')return actual>=high;if(n.op==='onBefore')return actual<high;if(n.op==='onAfter')return actual>=low;const upperDay=String(n.upper).length===10,upperStart=new Date(upperDay?n.upper+'T00:00':n.upper).getTime(),upper=upperDay?new Date(nextDayString(n.upper)+'T00:00').getTime():upperStart+60000;const within=actual>=low&&actual<upper;return n.op==='between'?within:!within;}
const aa=String(a).toLocaleLowerCase(),bb=String(b).trim().toLocaleLowerCase();if(n.op==='contains')return aa.includes(bb);if(n.op==='notContains')return !aa.includes(bb);if(n.op==='starts')return aa.startsWith(bb);if(n.op==='ends')return aa.endsWith(bb);if(['text','textarea','url'].includes(f.type)&&['eq','ne'].includes(n.op))return n.op==='eq'?aa===bb:aa!==bb;const order=compare(f,a,b);if(n.op==='eq')return order===0;if(n.op==='ne')return order!==0;if(n.op==='gt')return order>0;if(n.op==='gte')return order>=0;if(n.op==='lt')return order<0;if(n.op==='lte')return order<=0;const within=order>=0&&compare(f,a,n.upper)<=0;return n.op==='between'?within:!within;}
function matchesGroup(t,g){const active=g.children.filter(n=>enabledCount(n)>0);if(!active.length)return true;return g.match==='all'?active.every(n=>n.children?matchesGroup(t,n):matchesRule(t,n)):active.some(n=>n.children?matchesGroup(t,n):matchesRule(t,n));}
function query(c){return tasks.filter(t=>(c.archive==='all'||t.archived===(c.archive==='archived'))&&(!c.folder||t.folder===c.folder||(c.subfolders&&t.folder.startsWith(c.folder+'/')))&&matchesGroup(t,c.root)).sort((a,b)=>{for(const s of c.sorts){const an=empty(a[s.key]),bn=empty(b[s.key]);if(an!==bn)return an===(s.nulls==='first')?-1:1;if(an&&bn)continue;const d=compare(fields[s.key],a[s.key],b[s.key]);if(d)return s.direction==='asc'?d:-d;}return compare(fields.updated,b.updated,a.updated)||compare(fields.title,a.title,b.title)||a.id.localeCompare(b.id);});}
function displayValue(n){const f=fields[n.key];if(noValue(n.op))return '';if(n.op==='relative'){const name=relativeOptions.find(v=>v[0]===n.relative)?.[1]||'';return name.replace('N',n.days);}const format=v=>f.opts?f.opts.find(x=>x[0]===v)?.[1]||v:v;return Array.isArray(n.value)?n.value.map(format).join('、'):['between','outside'].includes(n.op)?`${format(n.value)}～${format(n.upper)}`:format(n.value);}
function summary(n){if(n.children){const active=n.children.filter(x=>enabledCount(x)>0);return active.length?'('+active.map(summary).join(n.match==='all'?' 且 ':' 或 ')+')':'不限';}return fields[n.key].name+' '+opLabel(fields[n.key],n.op)+(noValue(n.op)?'':' '+displayValue(n));}
function fieldOptions(current='',search=fieldSearch,sortable=false){const keys=Object.keys(fields).filter(k=>(!sortable||!['multi','textarea'].includes(fields[k].type))&&(!search||fields[k].name.includes(search)||k===current));return [true,false].map(b=>`<optgroup label="${b?'内置字段':'自定义属性'}">${keys.filter(k=>!!fields[k].built===b).map(k=>`<option value="${k}" ${k===current?'selected':''}>${fields[k].name}</option>`).join('')}</optgroup>`).join('');}
function inputHtml(n){const f=fields[n.key],id=n.id;if(noValue(n.op))return '<span class="p-sub">无需填写值</span>';if(collection(n.op))return `<div class="p-picks">${f.opts.map(([v,label])=>`<label><input id="v-${id}-${v}" type="checkbox" data-pick="${id}" value="${v}" ${(Array.isArray(n.value)&&n.value.includes(v))?'checked':''}>${label}</label>`).join('')}</div>`;if(f.opts)return `<select id="v-${id}" data-value="${id}" class="cursor-interaction" aria-label="${f.name}判断值"><option value="">选择值</option>${options(f.opts,n.value)}</select>`;if(n.op==='relative')return `<div class="p-relative"><select id="v-${id}-relative" data-relative="${id}" class="cursor-interaction" aria-label="相对时间范围">${options(relativeOptions,n.relative)}</select>${['last','next','older'].includes(n.relative)?`<input id="v-${id}-days" type="number" min="1" step="1" data-days="${id}" value="${esc(n.days)}" aria-label="相对天数">`:''}</div>`;const type=f.type==='number'?'number':f.type==='date'?'date':f.type==='datetime'?'datetime-local':'text';const input=(slot,value)=>`<input id="v-${id}-${slot}" type="${type}" ${type==='number'?'step="any"':''} data-${slot}="${id}" value="${esc(value)}" aria-label="${f.name}${slot==='upper'?'范围上界':'判断值'}" aria-describedby="error-${id}">`;return ['between','outside'].includes(n.op)?`<div class="p-range">${input('value',n.value)}<span class="p-sub">至</span>${input('upper',n.upper)}</div>`:input('value',n.value);}
function ruleHtml(n){const f=fields[n.key];return `<div class="p-rule ${n.enabled?'':'p-disabled'}" data-rule="${n.id}"><div class="p-rule-line"><label class="p-enable"><input id="enable-${n.id}" type="checkbox" data-enable="${n.id}" ${n.enabled?'checked':''} aria-label="启用${f.name}条件"></label><select id="field-${n.id}" data-field="${n.id}" class="cursor-interaction" aria-label="筛选字段">${fieldOptions(n.key,'')}</select><select id="op-${n.id}" data-op="${n.id}" class="cursor-interaction" aria-label="${f.name}判断条件">${options(ops(f).map(op=>[op,opLabel(f,op)]),n.op)}</select><div class="p-value">${inputHtml(n)}</div><details class="p-row-menu"><summary class="cursor-interaction" aria-label="${f.name}条件操作">⋯</summary><div><button data-copy="${n.id}" class="cursor-interaction">复制条件</button><button data-delete="${n.id}" class="cursor-interaction">删除条件</button></div></details></div><div id="error-${n.id}" class="p-error" role="alert" hidden></div></div>`;}
function groupHtml(g,depth=0){return `<div ${depth?'class="p-group"':''} data-group="${g.id}"><div class="p-group-head"><span class="p-sub">${depth?'条件组':'满足'}</span><select id="match-${g.id}" data-match="${g.id}" class="cursor-interaction" aria-label="${depth?'组内':'整体'}匹配方式">${options([['all','全部条件（AND）'],['any','任一条件（OR）']],g.match)}</select>${depth?`<button class="p-icon cursor-interaction" data-delete="${g.id}" aria-label="删除条件组">×</button>`:''}</div>${g.children.map(n=>n.children?groupHtml(n,depth+1):ruleHtml(n)).join('')}${!g.children.length?'<div class="p-sub">尚无条件，不限制匹配范围。</div>':''}<div class="p-add">${!depth?`<input id="p-field-search" class="p-search" type="text" aria-label="搜索可添加的字段" placeholder="搜索字段…" value="${esc(fieldSearch)}">`:''}<select id="add-${g.id}" data-add="${g.id}" class="cursor-interaction" aria-label="添加${depth?'组内':''}条件"><option value="">＋ 添加条件</option>${fieldOptions('',fieldSearch)}</select><button class="p-link cursor-interaction" data-add-group="${g.id}">＋ 条件组</button></div></div>`;}
function directionOptions(key){const type=fields[key].type;if(key==='due')return [['asc','最近到期'],['desc','最晚到期']];if(['date','datetime'].includes(type))return [['desc','最新优先'],['asc','最早优先']];if(type==='ordered')return [['desc','高到低'],['asc','低到高']];if(type==='select')return [['asc','选项顺序'],['desc','反向顺序']];if(type==='boolean')return [['desc','是优先'],['asc','否优先']];if(type==='number')return [['desc','大到小'],['asc','小到大']];return [['asc','A–Z'],['desc','Z–A']];}
function sortHtml(){return draft.sorts.map((s,i)=>`<div class="p-sort"><span class="p-sub">${i+1}</span><select id="sort-field-${i}" data-sort-field="${i}" class="cursor-interaction" aria-label="排序字段 ${i+1}">${Object.keys(fields).filter(k=>!['multi','textarea'].includes(fields[k].type)&&(k===s.key||!draft.sorts.some(v=>v.key===k))).map(k=>`<option value="${k}" ${k===s.key?'selected':''}>${fields[k].name}</option>`).join('')}</select><select id="sort-direction-${i}" data-sort-direction="${i}" class="cursor-interaction" aria-label="排序方向 ${i+1}">${options(directionOptions(s.key),s.direction)}</select>${fields[s.key].required?'<span class="p-null"></span>':`<select id="sort-null-${i}" data-sort-null="${i}" class="p-null cursor-interaction" aria-label="空值位置 ${i+1}">${options([['last','空值最后'],['first','空值最前']],s.nulls)}</select>`}<button class="p-icon p-up cursor-interaction" data-move="${i}" data-offset="-1" aria-label="上移排序 ${i+1}" ${i===0?'disabled':''}>↑</button><button class="p-icon p-down cursor-interaction" data-move="${i}" data-offset="1" aria-label="下移排序 ${i+1}" ${i===draft.sorts.length-1?'disabled':''}>↓</button><button class="p-icon p-remove-sort cursor-interaction" data-remove-sort="${i}" aria-label="删除排序 ${i+1}">×</button></div>`).join('');}
const quick=[['recent','最近更新',[{key:'updated',direction:'desc',nulls:'last'}]],['created','最近创建',[{key:'created',direction:'desc',nulls:'last'}]],['az','标题 A–Z',[{key:'title',direction:'asc',nulls:'last'}]],['za','标题 Z–A',[{key:'title',direction:'desc',nulls:'last'}]],['priority','优先级高到低',[{key:'priority',direction:'desc',nulls:'last'}]],['due','最近到期优先',[{key:'due',direction:'asc',nulls:'last'}]]];
function size(){if(open){const height=el('p-dialog').getBoundingClientRect().height;if(height>0)el('p-body').style.minHeight=Math.max(740,height+62)+'px';}}
function updateCounts(){const problems=errors(),map=new Map(problems);walk(draft.root,n=>{if(n.children)return;const node=el('error-'+n.id);if(node){node.textContent=map.get(n.id)||'';node.hidden=!map.has(n.id);}root.querySelectorAll(`[data-rule="${n.id}"] input:not([type=checkbox]),[data-rule="${n.id}"] .p-value select`).forEach(input=>{if(map.has(n.id))input.setAttribute('aria-invalid','true');else input.removeAttribute('aria-invalid');});});el('p-filter-count').textContent=enabledCount(draft.root);el('p-sort-count').textContent=draft.sorts.length;el('p-match-count').textContent=problems.length?`匹配 — · ${problems.length} 条条件待完善`:`匹配 ${query(draft).length} 项${query(draft).length?'':' · 没有匹配任务'}`;el('p-apply').disabled=!!problems.length;el('p-save-toggle').disabled=!!problems.length;el('p-save-view').disabled=!!problems.length;size();}
function renderEditor(){const focus=document.activeElement?.id;el('p-rule-tree').innerHTML=groupHtml(draft.root);el('p-sort-rows').innerHTML=sortHtml();el('p-quick').innerHTML=quick.map(([id,label,sorts])=>`<button data-quick="${id}" class="cursor-interaction" ${JSON.stringify(sorts)===JSON.stringify(draft.sorts)?'style="background:var(--p-selected);color:var(--p-accent)"':''}>${label}</button>`).join('');el('p-archive').value=draft.archive;el('p-folder').value=draft.folder;el('p-subfolders').checked=draft.subfolders;el('p-subfolder-label').hidden=!draft.folder;el('p-add-sort').disabled=draft.sorts.length>=Object.keys(fields).filter(k=>!['multi','textarea'].includes(fields[k].type)).length;updateCounts();if(focus&&el(focus))el(focus).focus();}
function renderList(){const list=query(applied);el('p-list-count').textContent=list.length+' 项';el('p-active-count').textContent=enabledCount(applied.root);el('p-open').dataset.active=String(enabledCount(applied.root)>0||JSON.stringify(applied.sorts)!==JSON.stringify(defaultSort));const conditions=applied.root.children.filter(n=>enabledCount(n)>0);el('p-applied-summary').innerHTML=conditions.length?`<button class="p-chip cursor-interaction" data-edit-summary aria-label="编辑已应用筛选">${esc(summary(applied.root))}</button>`:'';el('p-tasks').innerHTML=list.length?list.map(t=>`<div class="p-task" style="border:1px solid var(--p-border);border-radius:8px;background:var(--p-panel)"><strong>${esc(t.title)}</strong><div class="p-task-meta"><span>${states.find(v=>v[0]===t.status)?.[1]||'无状态'}</span><span>优先级 ${priorities.find(v=>v[0]===t.priority)?.[1]||'未设置'}</span><span>${t.due?'截止 '+t.due:'无截止日期'}</span></div></div>`).join(''):'<div class="p-empty">没有匹配任务<br><button class="p-link cursor-interaction" data-edit-summary>修改条件</button></div>';el('p-applied-sort').textContent=applied.sorts.map(s=>fields[s.key].name+' · '+directionOptions(s.key).find(v=>v[0]===s.direction)?.[1]).join(' → ');el('p-view').innerHTML='<option value="">全部任务 · 自定义</option>'+views.map(v=>`<option value="${esc(v.id)}">${esc(v.name)}</option>`).join('');el('p-view').value=activeId;}
function switchTab(next){tab=next;el('p-filters').hidden=tab!=='filter';el('p-sorts').hidden=tab!=='sort';el('p-filter-tab').setAttribute('aria-selected',String(tab==='filter'));el('p-sort-tab').setAttribute('aria-selected',String(tab==='sort'));size();}
function setOpen(value){open=value;el('p-overlay').hidden=!open;el('p-open').setAttribute('aria-expanded',String(open));root.querySelectorAll('.p-list,.p-editor').forEach(n=>n.inert=open);if(open)el(tab==='filter'?'p-filter-tab':'p-sort-tab').focus();else el('p-open').focus();size();}
function begin(){draft=clone(applied);saveOpen=false;el('p-save-box').hidden=true;el('p-save-toggle').setAttribute('aria-expanded','false');el('p-name-error').hidden=true;renderEditor();switchTab(tab);setOpen(true);}

el('p-open').onclick=begin;el('p-close').onclick=cancel;el('p-cancel').onclick=cancel;el('p-apply').onclick=apply;el('p-overlay').onclick=e=>{if(e.target===el('p-overlay'))cancel();};el('p-filter-tab').onclick=()=>{switchTab('filter');persist();};el('p-sort-tab').onclick=()=>{switchTab('sort');persist();};

root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-edit-summary')){tab='filter';begin();}else if(b.dataset.delete){remove(b.dataset.delete);renderEditor();persist();}else if(b.dataset.copy){const p=locateParent(b.dataset.copy),n=find(b.dataset.copy);if(p&&n){p.children.splice(p.children.indexOf(n)+1,0,copyNode(n));renderEditor();persist();}}else if(b.dataset.addGroup){find(b.dataset.addGroup).children.push({id:uid(),match:'any',children:[]});renderEditor();persist();}else if(b.dataset.quick){draft.sorts=clone(quick.find(v=>v[0]===b.dataset.quick)[2]);renderEditor();persist();}else if(b.dataset.move!==undefined){const i=Number(b.dataset.move),j=i+Number(b.dataset.offset);if(j>=0&&j<draft.sorts.length){[draft.sorts[i],draft.sorts[j]]=[draft.sorts[j],draft.sorts[i]];renderEditor();persist();}}else if(b.dataset.removeSort!==undefined){draft.sorts.splice(Number(b.dataset.removeSort),1);if(!draft.sorts.length)draft.sorts=clone(defaultSort);renderEditor();persist();}});
function inputChange(t){const slots=['value','upper','days'];for(const slot of slots)if(t.dataset[slot]){const n=find(t.dataset[slot]);if(n){n[slot]=t.value;updateCounts();persist();}return true;}return false;}
root.addEventListener('input',e=>{const t=e.target;if(t.id==='p-field-search'){fieldSearch=t.value;root.querySelectorAll('[data-add]').forEach(select=>select.innerHTML='<option value="">＋ 添加条件</option>'+fieldOptions('',fieldSearch));return;}inputChange(t);});
root.addEventListener('change',e=>{const t=e.target;if(t.id==='p-archive')draft.archive=t.value;else if(t.id==='p-folder')draft.folder=t.value;else if(t.id==='p-subfolders')draft.subfolders=t.checked;else if(t.dataset.match)find(t.dataset.match).match=t.value;else if(t.dataset.add&&t.value){find(t.dataset.add).children.push(leaf(t.value));fieldSearch='';}else if(t.dataset.field){const n=find(t.dataset.field),fresh=leaf(t.value);Object.assign(n,{...fresh,id:n.id,enabled:n.enabled});}else if(t.dataset.op){const n=find(t.dataset.op),f=fields[n.key],wasCollection=collection(n.op);n.op=t.value;if(collection(n.op)&&!wasCollection)n.value=[];else if(!collection(n.op)&&wasCollection)n.value='';n.upper='';if(['date','datetime'].includes(f.type)&&n.op==='relative'){n.relative='last';n.days=7;}}else if(t.dataset.enable)find(t.dataset.enable).enabled=t.checked;else if(t.dataset.pick){const n=find(t.dataset.pick);n.value=t.checked?[...n.value,t.value]:n.value.filter(v=>v!==t.value);}else if(t.dataset.relative)find(t.dataset.relative).relative=t.value;else if(t.dataset.sortField!==undefined){const s=draft.sorts[Number(t.dataset.sortField)];s.key=t.value;s.direction=directionOptions(s.key)[0][0];}else if(t.dataset.sortDirection!==undefined)draft.sorts[Number(t.dataset.sortDirection)].direction=t.value;else if(t.dataset.sortNull!==undefined)draft.sorts[Number(t.dataset.sortNull)].nulls=t.value;else if(inputChange(t))return;else return;renderEditor();persist();});
root.addEventListener('keydown',e=>{if(!open)return;if(e.key==='Escape'){e.preventDefault();cancel();return;}if(['ArrowLeft','ArrowRight'].includes(e.key)&&e.target.getAttribute('role')==='tab'){e.preventDefault();switchTab(tab==='filter'?'sort':'filter');el(tab==='filter'?'p-filter-tab':'p-sort-tab').focus();persist();}if(e.key==='Tab'){const nodes=[...el('p-dialog').querySelectorAll('button:not(:disabled),select:not(:disabled),input:not(:disabled),summary')].filter(n=>!n.closest('[hidden]')&&n.getClientRects().length>0),first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('openai:set_globals',e=>{const w=e.detail?.globals?.widgetState,p=w?.privateContent;if(w?.modelContent?.demo!=='taskmate-complete'||!safeConfig(p?.applied))return;applied=clone(p.applied);draft=safeConfig(p.draft)?clone(p.draft):clone(applied);views=Array.isArray(p.views)?p.views.filter(v=>v&&typeof v.name==='string'&&safeConfig(v.config)):[];activeId=p.activeId||'';tab=p.tab==='sort'?'sort':'filter';walk(draft.root,n=>{const v=Number(n.id.slice(1));if(Number.isFinite(v))nextId=Math.max(nextId,v+1);});renderList();renderEditor();switchTab(tab);});
renderList();renderEditor();switchTab(tab);setOpen(true);
if(globalThis.ResizeObserver)new ResizeObserver(size).observe(el('p-dialog'));
if(globalThis.Tweak){const style={compact:false};new Tweak({container:root,onChange:()=>root.querySelectorAll('.p-task').forEach(n=>n.style.padding=style.compact?'7px 10px':'11px')}).addToggle(style,'compact',{label:'紧凑任务卡片'});}
})();
</script>
</div>
